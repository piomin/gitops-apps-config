replicaCount: 1

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

configMap:
  enabled: true
  data: {}
  # example:
  #   APP_ENV: production
  #   LOG_LEVEL: info

secret:
  enabled: false
  data: {}
  # example (values should be base64 encoded):
  #   DB_PASSWORD: cGFzc3dvcmQ=
  #   API_KEY: c2VjcmV0

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
