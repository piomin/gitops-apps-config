apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: sample-ocp-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: base-app
    helm.sh/chart: base-app-0.1.0
  name: sample-ocp-app-base-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: sample-ocp-app
      app.kubernetes.io/name: base-app
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sample-ocp-app
        app.kubernetes.io/name: base-app
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: sample-ocp-app-base-app
            - secretRef:
                name: sample-ocp-app-base-app
          image: quay.io/pminkows/sample-ocp-app:1.0.1
          imagePullPolicy: IfNotPresent
          name: base-app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
