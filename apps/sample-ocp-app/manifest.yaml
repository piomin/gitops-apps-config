apiVersion: v1
data:
  API_URL: http://api-gateway.test.svc:8080
  APP_ENV: test
  LOG_LEVEL: info
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: sample-ocp-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: base-app
    helm.sh/chart: base-app-0.1.0
  name: sample-ocp-app-base-app
