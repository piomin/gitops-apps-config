apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: sample-ocp-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: base-app
    helm.sh/chart: base-app-0.1.0
  name: sample-ocp-app-base-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: sample-ocp-app
      app.kubernetes.io/name: base-app
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sample-ocp-app
        app.kubernetes.io/name: base-app
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: sample-ocp-app-base-app
            - secretRef:
                name: sample-ocp-app-base-app
          image: image-registry.openshift-image-registry.svc:5000/ci/sample-ocp-app:1.2.2
          imagePullPolicy: Always
          name: base-app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
