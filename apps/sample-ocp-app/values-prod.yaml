replicaCount: 3

image:
  repository: image-registry.openshift-image-registry.svc:5000/ci/sample-ocp-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "2000m"

configMap:
  enabled: true
  data:
    APP_ENV: production
    LOG_LEVEL: warn
    API_URL: "http://api-gateway.prod.svc:8080"

secret:
  enabled: true
  data:
    DB_PASSWORD: cHJvZC1wYXNzd29yZA==
    API_KEY: cHJvZC1hcGkta2V5

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 20
    periodSeconds: 15
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
