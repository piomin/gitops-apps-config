replicaCount: 2

image:
  repository: image-registry.openshift-image-registry.svc:5000/ci/sample-ocp-app
  tag: "1.0.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

configMap:
  enabled: true
  data:
    APP_ENV: test
    LOG_LEVEL: info
    API_URL: "http://api-gateway.test.svc:8080"

secret:
  enabled: true
  data:
    DB_PASSWORD: dGVzdC1wYXNzd29yZA==
    API_KEY: dGVzdC1hcGkta2V5

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
