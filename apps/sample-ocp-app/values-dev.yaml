replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/ci/sample-ocp-app
  tag: "67c03d58686cd3199b3b0b55d1938d1fc136f246"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

configMap:
  enabled: true
  data:
    APP_ENV: dev
    LOG_LEVEL: debug
    API_URL: "http://api-gateway.dev.svc:8080"

secret:
  enabled: true
  data:
    DB_PASSWORD: ZGV2LXBhc3N3b3Jk
    API_KEY: ZGV2LWFwaS1rZXk=

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
